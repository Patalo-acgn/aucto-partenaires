<title>Aucto Partenaires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap">

<style>
:root {
  --navy: #0A2E40;
  --teal: #0CB8B6;
  --white: #ffffff;
  --muted: rgba(10,46,64,0.4);
  --border: rgba(12,184,182,0.3);
  --btn-shadow: 0 2px 16px rgba(12,184,182,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  overflow: hidden;
  position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2rem;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 1.75rem;
}

.logo-wrap img {
  height: 110px;
  width: auto;
  filter: brightness(0) saturate(100%) invert(27%) sepia(51%) saturate(500%) hue-rotate(155deg) brightness(90%);
  animation: fadein 0.9s ease forwards;
}

.tagline {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: clamp(0.8rem, 1.8vw, 1rem);
  color: var(--navy);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  animation: fadein 1.1s ease forwards;
}

.divider {
  width: 36px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  animation: fadein 1.3s ease forwards;
}

.contact-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.875rem;
  animation: fadein 1.5s ease forwards;
}

.contact-label {
  font-family: 'Syne', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--teal), var(--navy), var(--teal));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 5s linear infinite;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: var(--white);
  border: 1.5px solid var(--border);
  color: var(--navy);
  padding: 0.7rem 1.6rem;
  border-radius: 100px;
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  box-shadow: var(--btn-shadow);
}
.btn:hover {
  background: #f0fdfb;
  border-color: var(--teal);
  box-shadow: 0 4px 24px rgba(12,184,182,0.2);
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }

.footer-mention {
  position: absolute;
  bottom: 1.25rem;
  font-size: 0.7rem;
  color: var(--muted);
  z-index: 2;
}
.footer-mention a { color: rgba(10,46,64,0.35); text-decoration: none; }
.footer-mention a:hover { color: var(--navy); }

@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes shimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }

@media (prefers-reduced-motion: reduce) {
  .logo-wrap img, .tagline, .divider, .contact-wrap { animation: none; }
}
</style>

<canvas id="dots"></canvas>

<div class="container">
  <div class="logo-wrap">
    <img src="assets/logos/logo_cropped.png" alt="Aucto Partenaires">
  </div>
  <div class="tagline">Structuration &amp; Développement commercial B2B</div>
  <div class="divider"></div>
  <div class="contact-wrap">
    <span class="contact-label">Me contacter</span>
    <a href="mailto:contact@aucto-partenaires.com" class="btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0CB8B6" stroke-width="2">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-10 7L2 7"/>
      </svg>
      contact@aucto-partenaires.com
    </a>
    <a href="https://www.linkedin.com/in/alexis-cagnon/" target="_blank" rel="noopener" class="btn">
      <svg viewBox="0 0 24 24" fill="#0CB8B6">
        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/>
        <rect x="2" y="9" width="4" height="12"/>
        <circle cx="4" cy="4" r="2"/>
      </svg>
      LinkedIn
    </a>
  </div>
</div>

<div class="footer-mention">
  © 2026 Alexis Cagnon, EI &nbsp;·&nbsp; <a href="mentions-legales.html">Mentions légales</a>
</div>

<script>
(function() {
  const canvas = document.getElementById('dots');
  const ctx = canvas.getContext('2d');

  const SPACING = 19;
  const DOT_R = 1.8;
  const INFLUENCE = 130;
  const MAX_PUSH = 28;
  const TEAL = [12, 184, 182];
  const NAVY = [10, 46, 64];

  let W, H, cols, rows, dots = [];
  let mouse = { x: -9999, y: -9999 };

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildDots();
  }

  function buildDots() {
    dots = [];
    cols = Math.ceil(W / SPACING) + 1;
    rows = Math.ceil(H / SPACING) + 1;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        dots.push({
          ox: c * SPACING,
          oy: r * SPACING,
          x: c * SPACING,
          y: r * SPACING,
          vx: 0,
          vy: 0
        });
      }
    }
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (let d of dots) {
      const dx = mouse.x - d.ox;
      const dy = mouse.y - d.oy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      let tx = d.ox, ty = d.oy;
      let alpha = 0.18;

      if (dist < INFLUENCE && dist > 0) {
        const force = (1 - dist / INFLUENCE);
        const push = force * MAX_PUSH;
        tx = d.ox - (dx / dist) * push;
        ty = d.oy - (dy / dist) * push;
        alpha = lerp(0.18, 0.65, force);
      }

      // spring toward target
      d.vx += (tx - d.x) * 0.18;
      d.vy += (ty - d.y) * 0.18;
      d.vx *= 0.72;
      d.vy *= 0.72;
      d.x += d.vx;
      d.y += d.vy;

      // color: interpolate between teal and navy based on proximity
      const t = dist < INFLUENCE ? (1 - dist / INFLUENCE) : 0;
      const r = Math.round(lerp(NAVY[0], TEAL[0], t));
      const g = Math.round(lerp(NAVY[1], TEAL[1], t));
      const b = Math.round(lerp(NAVY[2], TEAL[2], t));

      ctx.beginPath();
      ctx.arc(d.x, d.y, DOT_R + t * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', e => {
    if (e.touches.length) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, { passive: true });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  resize();
  draw();
})();
</script>
